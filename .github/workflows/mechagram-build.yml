name: Mechagram iOS Simulator
on:
  push:
    branches: [mechagram]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile simulator preview
        run: |
          xcodebuild -version
          echo 'build --//Telegram:disableProvisioningProfiles' >> .bazelrc
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("build-system/appstore-configuration.json")
          config = json.loads(path.read_text())
          config.update(bundle_id="org.tele.ram", app_specific_url_scheme="mechagram",
                        is_appstore_build="false", enable_siri=False, enable_icloud=False)
          Path("build-system/mechagram-simulator.json").write_text(json.dumps(config))
          PY
          python3 build-system/Make/Make.py --overrideXcodeVersion build \
            --configurationPath=build-system/mechagram-simulator.json \
            --xcodeManagedCodesigning \
            --configuration=debug_sim_arm64 --buildNumber="$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: mechagram-ios-simulator
          path: bazel-out/**/Telegram/Telegram.zip
          if-no-files-found: error
